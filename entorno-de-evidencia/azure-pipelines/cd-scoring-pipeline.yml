# Pipeline CD de scoring + monitor — flight_delay_model (Opcion C: branch-gated)
# Nombre en Azure DevOps: flight_delay_model-cd-scoring
# Se dispara con push/merge a release (certificacion de negocio ya hecha en QA).
# Mantiene el gate de aprobacion manual (prd-approval-ops) como control adicional
# antes de tocar PRD.

trigger:
  branches:
    include:
      - release

extends:
  template: ../framework/pipelines/cd-scoring-template.yml
  parameters:
    bundleName:                flight_delay_model
    featureMaterializationJob: flight_delay_model_feature_materialization_job
    batchScoringJob:           flight_delay_model_batch_scoring_job
    modelPromotionPrdJob:      flight_delay_model_model_promotion_prd_job
    databricksClientId:         SERVICE_PRINCIPAL
    prdVariableGroup:          mlops-vg-prd
    prdEnvironment:            prd-approval-ops
