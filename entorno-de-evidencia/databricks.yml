bundle:
  name: flight_delay_model

variables:
  model_name:
    description: Nombre del modelo en Unity Catalog (patron md_{area}_{subject}).
    default: md_operaciones_flight
  catalog_name:
    description: Catalogo ML por ambiente (patron gold_adv_{ambiente}).
  schema_name:
    description: Schema dentro del catalogo ({area_negocio}_{proyecto}).
    default: operaciones_flight_delay
  qa_catalog_name:
    description: Catalogo QA, origen del @champion validado para la promocion a PRD.
    default: workspace
  qa_schema_name:
    description: Schema QA, origen del @champion validado.
    default: adv_qa_flight_delay
  use_dummy:
    description: Datos sinteticos en lugar de tabla fuente real.
    default: "true"

sync:
  include:
    - src/**

include:
  - ./resources/model-training-workflow.yml
  - ./resources/batch-inference-workflow.yml
  - ./resources/feature-materialization-workflow.yml
  - ./resources/monitoring-workflow.yml
  # Job de promocion QA -> PRD. Se declara para todos los targets pero solo
  # tiene sentido ejecutarlo en prod, detras del gate de aprobacion manual.
  - ./resources/model-promotion-prd-workflow.yml
  - ./resources/agent-workflow.yml

targets:
  dev:
    default: true
    variables:
      catalog_name: workspace
      schema_name: adv_dev_flight_delay
    workspace:
      host: https://<workspace-host>
      root_path: /Workspace/Users/${workspace.current_user.userName}/${bundle.name}/${bundle.target}
    resources:
      experiments:
        flight_delay_model_experiment:
          name: ${workspace.root_path}/flight_delay_model
      jobs:
        flight_delay_model_batch_scoring_job:
          schedule:
            pause_status: PAUSED
      registered_models:
        flight_delay_model_model_uc:
          name: ${var.model_name}
          catalog_name: ${var.catalog_name}
          schema_name: ${var.schema_name}
          comment: "flight_delay_model — ops/operaciones"

  qa:
    variables:
      catalog_name: workspace
      schema_name: adv_qa_flight_delay
    workspace:
      host: https://<workspace-host>
      root_path: /Workspace/Users/${workspace.current_user.userName}/${bundle.name}/${bundle.target}
    resources:
      experiments:
        flight_delay_model_experiment:
          name: ${workspace.root_path}/flight_delay_model
      jobs:
        flight_delay_model_batch_scoring_job:
          schedule:
            pause_status: PAUSED
      registered_models:
        flight_delay_model_model_uc:
          name: ${var.model_name}
          catalog_name: ${var.catalog_name}
          schema_name: ${var.schema_name}
          comment: "flight_delay_model — ops/operaciones"

  # PRD: sin experimento y sin registered_models declarado.
  # El modelo llega por copy_model_version desde QA, tras aprobacion manual.
  prod:
    mode: production
    variables:
      catalog_name: workspace
      schema_name: adv_prd_flight_delay
    workspace:
      host: https://<workspace-host>
      root_path: /Workspace/Users/${workspace.current_user.userName}/${bundle.name}/${bundle.target}
    # run_as:
    #   service_principal_name: <sp-prd>
    # Comentado: la creacion de service principals corresponde al equipo de plataforma.
    # El pipeline de CD lo activa cuando la identidad existe.
    resources:
      jobs:
        flight_delay_model_batch_scoring_job:
          schedule:
            pause_status: PAUSED
